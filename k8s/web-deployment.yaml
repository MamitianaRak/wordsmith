apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordsmith-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordsmith-web
  template:
    metadata:
      labels:
        app: wordsmith-web
    spec:
      containers:
        - name: web
          image: jpetazzo/wordsmith-web:latest
          ports:
            - containerPort: 80
          env:
            - name: WORDS_HOST
              value: "wordsmith-words"
            - name: WORDS_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: wordsmith-web
spec:
  selector:
    app: wordsmith-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
